<svg id="graph" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 440px;" viewBox="0 0 440 554.75" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#graph{font-family:PingFang SC,Arial;font-size:20px;fill:#182c48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#graph .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#graph .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#graph .error-icon{fill:#f5f7fa;}#graph .error-text{fill:#0a0805;stroke:#0a0805;}#graph .edge-thickness-normal{stroke-width:1px;}#graph .edge-thickness-thick{stroke-width:3.5px;}#graph .edge-pattern-solid{stroke-dasharray:0;}#graph .edge-thickness-invisible{stroke-width:0;fill:none;}#graph .edge-pattern-dashed{stroke-dasharray:3;}#graph .edge-pattern-dotted{stroke-dasharray:2;}#graph .marker{fill:#75869e;stroke:#75869e;}#graph .marker.cross{stroke:#75869e;}#graph svg{font-family:PingFang SC,Arial;font-size:20px;}#graph p{margin:0;}#graph .label{font-family:PingFang SC,Arial;color:#182c48;}#graph .cluster-label text{fill:#0a0805;}#graph .cluster-label span{color:#0a0805;}#graph .cluster-label span p{background-color:transparent;}#graph .label text,#graph span{fill:#182c48;color:#182c48;}#graph .node rect,#graph .node circle,#graph .node ellipse,#graph .node polygon,#graph .node path{fill:#eef3ff;stroke:#7790bf;stroke-width:1px;}#graph .rough-node .label text,#graph .node .label text,#graph .image-shape .label,#graph .icon-shape .label{text-anchor:middle;}#graph .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#graph .rough-node .label,#graph .node .label,#graph .image-shape .label,#graph .icon-shape .label{text-align:center;}#graph .node.clickable{cursor:pointer;}#graph .root .anchor path{fill:#75869e!important;stroke-